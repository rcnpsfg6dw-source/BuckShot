  crates.forEach(c=>{if(c.h&&!c.open)c.m.visible=Math.hypot(c.m.position.x-me.x,c.m.position.z-me.z)<1.6});if(I.e){I.e=false;crates.forEach((c,i)=>{if(!c.open&&Math.hypot(c.m.position.x-me.x,c.m.position.z-me.z)<(c.h?.9:2.5)){tk(i);room.emit('crate',{i});tone(500,0,.1,'triangle',.3,900);tone(900,.1,.15,'triangle',.3,1400);
   if(c.s){const w=[2,5,6,7,8][Math.floor(Math.random()*5)];give(w);toast('Ukryta skrzynia: '+W[w].n+'!',2000)}else if(Math.random()<.25){give(me.w,1);toast('+Amunicja')}else{const w=1+Math.floor(Math.random()*(W.length-1));give(w);toast(W[w].n+'!')}}})}
  if(me.k>=WIN)finish(true);else if(oppK>=WIN&&!G.over){/* czeka na 'end' od przeciwnika */}
  pT-=dt;if(pT<=0){pT=.06;room.presence({x:me.x,y:me.y,z:me.z,ry:me.ry,hp:me.hp,ch:S.ch,nk:S.nick,mv:Math.hypot(mx,mz)>.1?1:0})}
  mesh.position.set(me.x,me.y,me.z);mesh.rotation.y=me.ry+Math.PI;mesh.visible=!me.dead;anim(mesh,Math.hypot(mx,mz)>.1,now);
  const op=room.peers().find(p=>!p.isMe&&p.presence&&p.presence.x!==undefined);
  if(op){const q=op.presence;oppNick=q.nk||'Wróg';if(q.ch!==eMesh.ch){sc.remove(eMesh);eMesh=mk(q.ch);eMesh.ch=q.ch}eMesh.visible=q.hp>0;eMesh.position.lerp(new THREE.Vector3(q.x,q.y,q.z),.4);eMesh.rotation.y=q.ry+Math.PI;anim(eMesh,q.mv,now)}
  const fov=I.a||mouseA?(me.w==3?18:45):70;cam.fov+=(fov-cam.fov)*.2;cam.updateProjectionMatrix();
  const cp=Math.cos(me.pit),dist=I.a&&me.w==3?.1:4;
  const bx=Math.sin(me.ry)*dist*cp,bz=Math.cos(me.ry)*dist*cp;cam.position.set(me.x+bx+Math.cos(me.ry)*.6,me.y+2.2-Math.sin(me.pit)*dist,me.z+bz-Math.sin(me.ry)*.6);
  cam.rotation.set(me.pit,me.ry,0,'YXZ');
  $('top').textContent=`${S.nick} ${'❤'.repeat(Math.max(0,WIN-oppK))} | HP ${Math.max(0,me.hp)} | ${oppNick} ${'❤'.repeat(Math.max(0,WIN-me.k))}`;
  $('bot').innerHTML=`${W[me.w].n}<br>${me.mag} / ${me.res}`;
 }else if(state=='chars'&&pv){pv.position.set(0,0,60);pv.rotation.y=now/900;anim(pv,1,now);cam.fov=60;cam.updateProjectionMatrix();cam.position.set(0,2,64.5);cam.rotation.set(0,0,0);cam.lookAt(0,1.2,60)}else if(state!='play'){const t=now/4000;cam.position.set(Math.sin(t)*30,14,Math.cos(t)*30);cam.lookAt(0,0,0)}
 R.render(sc,cam)}
function anim(g,mv,now){const s=mv?Math.sin(now/90)*.7:0;g.legs[0].rotation.x=s;g.legs[1].rotation.x=-s;g.arms[0].rotation.x=-s;g.arms[1].rotation.x=-1.4;g.position.y+=mv?Math.abs(Math.sin(now/90))*.06:0}
// ---------- STEROWANIE ----------
const keys={};let mouseF=false,mouseA=false;
const kx=()=>(keys.d?1:0)-(keys.a?1:0),kz=()=>(keys.s?1:0)-(keys.w?1:0);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k==' ')I.j=true;if(k=='r')reload();if(k=='e')I.e=true});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
cv.addEventListener('mousedown',e=>{if(state!='play')return;if(document.pointerLockElement!==cv){cv.requestPointerLock&&cv.requestPointerLock();return}if(e.button==0)mouseF=true;if(e.button==2)mouseA=true});
addEventListener('mouseup',e=>{mouseF=false;mouseA=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousemove',e=>{if(document.pointerLockElement===cv&&state=='play'){me.ry-=e.movementX*.0025;me.pit=Math.max(-1.2,Math.min(1.2,me.pit-e.movementY*.0025))}});
// dotyk: joystick + obrót kamery
const joy=$('joy'),kn=$('knob');let jid=null,lid=null,lx=0,ly=0;
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId==jid)jm(e)});
const jend=e=>{if(e.pointerId==jid){jid=null;I.mx=I.mz=0;kn.style.left=kn.style.top='45px'}};
joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
function jm(e){const r=joy.getBoundingClientRect();let dx=(e.clientX-r.left-65)/45,dz=(e.clientY-r.top-65)/45;const l=Math.hypot(dx,dz);if(l>1){dx/=l;dz/=l}I.mx=dx;I.mz=dz;kn.style.left=45+dx*40+'px';kn.style.top=45+dz*40+'px'}
cv.addEventListener('pointerdown',e=>{if(e.pointerType=='mouse'||state!='play')return;if(e.clientX>innerWidth*.35&&lid===null){lid=e.pointerId;lx=e.clientX;ly=e.clientY}});
cv.addEventListener('pointermove',e=>{if(e.pointerId==lid){me.ry-=(e.clientX-lx)*.006;me.pit=Math.max(-1.2,Math.min(1.2,me.pit-(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY}});
const lend=e=>{if(e.pointerId==lid)lid=null};cv.addEventListener('pointerup',lend);cv.addEventListener('pointercancel',lend);
function hold(id,fn,up){const b=$(id);b.addEventListener('pointerdown',e=>{e.stopPropagation();fn()});if(up){b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up)}}
hold('bF',()=>I.f=true,()=>I.f=false);hold('bJ',()=>I.j=true);hold('bR',reload);hold('bA',()=>I.a=!I.a);hold('bE',()=>I.e=true);
let tx=0,ty=0;menu.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
menu.addEventListener('touchend',e=>{const c=e.changedTouches[0];if(Math.abs(c.clientX-tx)>12||Math.abs(c.clientY-ty)>12)return;const t=e.target.closest&&e.target.closest('button,.card');if(t&&t.getAttribute('onclick')){e.preventDefault();t.click()}},{passive:false});
['pointerdown','pointerup','click','touchend','keydown'].forEach(e=>addEventListener(e,audio,true));
main();initNet();requestAnimationFrame(loop);
