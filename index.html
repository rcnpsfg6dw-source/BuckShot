html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}

.menu{position:absolute;inset:0;pointer-events:auto;background:linear-gradient(160deg,#2d1b4e,#0f0820);overflow:auto;padding:16px;text-align:center}

h1{font-size:48px;margin:8px 0;color:var(--ac);text-shadow:3px 3px #000}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;text-align:left}
.card{background:var(--pn);border-radius:12px;padding:8px;font-size:13px}
.card.sel{outline:3px solid var(--ac)}
.bar{height:12px;background:#0006;border-radius:6px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--ac)}
#hud{position:absolute;inset:0;pointer-events:none;display:none}
#hud *{pointer-events:none}
#joy{position:absolute;left:24px;bottom:30px;width:130px;height:130px;border-radius:50%;background:#fff3;pointer-events:auto!important}
#knob{position:absolute;left:45px;top:45px;width:40px;height:40px;border-radius:50%;background:#fffa}
.btn{position:absolute;width:62px;height:62px;border-radius:50%;background:#ff9f1caa;color:#222;font-weight:800;display:flex;align-items:center;justify-content:center;pointer-events:auto!important;font-size:12px}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border:2px solid #fff;border-radius:50%}
#top{position:absolute;top:8px;left:0;right:0;text-align:center;font-weight:800;font-size:22px;text-shadow:2px 2px #000}
#bot{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);text-align:center;font-weight:700;text-shadow:1px 1px #000;width:200px}
#toast{position:absolute;top:22%;width:100%;text-align:center;font-size:26px;font-weight:900;text-shadow:2px 2px #000}

 if(d>10){mx=dx/d;mz=dz/d}else if(d<5){mx=-dx/d;mz=-dz/d}mx+=-dz/d*st*.9;mz+=dx/d*st*.9;

 boxes.forEach(bx=>{const cx=Math.max(bx[0],Math.min(b.x,bx[2])),cz=Math.max(bx[1],Math.min(b.z,bx[3])),ex=b.x-cx,ez=b.z-cz,dd=Math.hypot(ex,ez);if(dd<.5){if(dd>0){b.x+=ex/dd*(.5-dd);b.z+=ez/dd*(.5-dd)}else{b.x=ox;b.z=oz}}});
 b.x=Math.max(-A,Math.min(A,b.x));b.z=Math.max(-A,Math.min(A,b.z));b.p.x=b.x;b.p.z=b.z;b.p.ry=b.ry;b.p.mv=1;
 b.t-=dt;if(b.t<=0&&!me.dead){b.t=.7+Math.random()*.5;const o=new THREE.Vector3(b.x,1.5,b.z),dir=new THREE.Vector3(me.x,1.2,me.z).sub(o).normalize(),wh=new THREE.Raycaster(o,dir,0,d).intersectObjects(wm)[0];
  if(!wh||wh.distance>d-.5){dsp('shot',{o:[o.x,o.y-.2,o.z],d:[dir.x,dir.y,dir.z],w:0,l:Math.min(d,40)});if(Math.random()<.4&&d<30)dsp('hit',{d:12})}}}
// ---------- GRA ----------
function startGame(){state='play';setMus(.35);const ps=room.peers().slice().sort((a,b)=>a.peer<b.peer?-1:1),my=ps.findIndex(p=>p.isMe&&p.sameTab)<0?0:ps.findIndex(p=>p.isMe&&p.sameTab);
 G={slot:my%2,over:false,t0:Date.now()};oppK=0;me.k=0;rm={a:0,b:0};crates.forEach(c=>{c.open=false;c.m.visible=true});
 if(mesh)sc.remove(mesh);if(eMesh)sc.remove(eMesh);mesh=mk(S.ch);eMesh=null;eMesh=mk(0);eMesh.visible=false;
 respawn();give(0);
 room.presence({ch:S.ch,hp:100});const hk=!room._h;room._h=1;if(room.bot){const s=SP[1-G.slot];bot.hp=100;bot.dead=0;bot.x=s[0];bot.z=s[1];bot.p.hp=100;bot.t=1.5}
 hk&&room.on('kill',m=>{if(!m.isMe){me.k++;toast('Eliminacja!',800)}});hk&&room.on('shot',m=>{if(m.isMe)return;const d=m.data;fx(new THREE.Vector3(...d.o),new THREE.Vector3(...d.d),W[d.w].c,d.l,d.w)});
 hk&&room.on('hit',m=>{if(m.isMe||G.over)return;me.hp-=m.data.d;flash();tone(160,0,.18,'sawtooth',.3,70);if(me.hp<=0&&me.dead!==1){me.dead=1;oppK++;room.emit('kill',{});toast('Tracisz życie! Zostało: '+Math.max(0,WIN-oppK),2000);tone(400,0,.6,'sawtooth',.35,50);setTimeout(()=>{respawn()},2000)}});

 menu.style.display='none';hud.style.display='block';toast('START! Gdzieś ukryto skrzynie ze strzelbami',3000)}
function respawn(){const s=SP[(G.slot+(me.k+oppK))%2];me.x=s[0];me.z=s[1];me.y=0;me.hp=100;me.dead=0;me.ry=Math.atan2(-me.x,-me.z)+Math.PI}
function give(w,ammoOnly){if(!ammoOnly){me.w=w;me.mag=W[w].m}me.res+=W[w].m*2;me.t=0}
function tk(i){crates[i].open=true;crates[i].m.visible=false}
function flash(){document.body.style.boxShadow='inset 0 0 80px red';setTimeout(()=>document.body.style.boxShadow='',150)}
function fx(o,d,col,l,w){sfx(w,o);const ln=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,l,6),new THREE.MeshBasicMaterial({color:col}));ln.position.copy(o).addScaledVector(d,l/2);ln.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d);sc.add(ln);effs.push({o:ln,t:.12});
 const s=new THREE.Mesh(new THREE.SphereGeometry(.5),new THREE.MeshBasicMaterial({color:col}));s.position.copy(o.clone().addScaledVector(d,l));sc.add(s);effs.push({o:s,t:.15})}
function finish(win){if(G.over)return;G.over=true;[0,4,7,12].forEach((n,k)=>tone(win?330*Math.pow(2,n/12):220-k*30,k*.15,.3,'square',.2));if(win){S.win++;room.emit('end',{})}else S.loss++;S.kills+=me.k;addXP(me.k*10+(win?50:15),me.k*5+(win?40:10));
 show(`<h1>${win?'ZWYCIĘSTWO!':'PORAŻKA'}</h1><p style="font-size:24px">${me.k} : ${oppK}</p><p>+${me.k*10+(win?50:15)} XP · Poz. ${S.lv}</p><div class=bar><i style="width:${S.xp/need(S.lv)*100}%"></i></div><button onclick="rm.a=1;room.emit('rm',{});this.textContent='Czekam…';if(rm.b)startGame()">REWANŻ</button><button onclick="main()">MENU</button>`);hud.style.display='none'}
function shoot(){const w=W[me.w];if(me.t>0||me.rel>0||me.dead||G.over)return;if(me.mag<=0){reload();return}
 me.mag--;me.t=w.r;const cp=Math.cos(me.pit),dir=new THREE.Vector3(-Math.sin(me.ry)*cp,Math.sin(me.pit),-Math.cos(me.ry)*cp);
 const o=new THREE.Vector3(me.x,me.y+1.5,me.z);let tot=0,len=w.rg;
 for(let p=0;p<w.p;p++){const d=dir.clone();if(w.p>1){d.x+=(Math.random()-.5)*.12;d.y+=(Math.random()-.5)*.08;d.z+=(Math.random()-.5)*.12;d.normalize()}
  const rc=new THREE.Raycaster(o,d,0,w.rg),wh=rc.intersectObjects(wm)[0];const wl=wh?wh.distance:w.rg;len=Math.min(len,wl);
  if(eMesh&&eMesh.visible){const sp=new THREE.Sphere(new THREE.Vector3(eMesh.position.x,1.2,eMesh.position.z),.8),pt=new THREE.Vector3();if(rc.ray.intersectSphere(sp,pt)&&o.distanceTo(pt)<wl)tot+=w.d}}
 fx(o.clone().add(new THREE.Vector3(0,-.2,0)),dir,w.c,Math.min(len,40),me.w);room.emit('shot',{o:[o.x,o.y-.2,o.z],d:[dir.x,dir.y,dir.z],w:me.w,l:Math.min(len,40)});
 if(tot>0){room.emit('hit',{d:tot});toast(tot+'!',300);tone(900,0,.08,'square',.2,500)}
 if(me.mag<=0)reload()}
function reload(){const w=W[me.w];if(me.rel>0||me.mag>=w.m||me.res<=0)return;me.rel=1.2;tone(300,0,.05,'square',.2);tone(450,.6,.06,'square',.2);toast('Przeładowanie…',900)}
function collide(){boxes.forEach(b=>{const r=.5,cx=Math.max(b[0],Math.min(me.x,b[2])),cz=Math.max(b[1],Math.min(me.z,b[3])),dx=me.x-cx,dz=me.z-cz,d=Math.hypot(dx,dz);if(d<r){if(d>0){me.x+=dx/d*(r-d);me.z+=dz/d*(r-d)}else me.x=b[0]-r}})}
// ---------- PĘTLA ----------
let last=performance.now(),pT=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;
 effs=effs.filter(e=>{e.t-=dt;if(e.t<=0){sc.remove(e.o);return false}return true});
 if(state=='play'&&G&&!G.over){
  if(room.bot)botTick(dt);me.t-=dt;if(me.rel>0){me.rel-=dt;if(me.rel<=0){const n=Math.min(W[me.w].m-me.mag,me.res);me.mag+=n;me.res-=n}}
  const sp=(I.a?3:6)*dt;let mx=I.mx+kx(),mz=I.mz+kz();const l=Math.hypot(mx,mz);if(l>1){mx/=l;mz/=l}
  if(!me.dead){me.x+=(mx*Math.cos(me.ry)+mz*Math.sin(me.ry))*sp;me.z+=(-mx*Math.sin(me.ry)+mz*Math.cos(me.ry))*sp;
   if(I.j&&me.y<=0){me.vy=7}I.j=false;collide();me.x=Math.max(-A,Math.min(A,me.x));me.z=Math.max(-A,Math.min(A,me.z))}
  me.vy-=20*dt;me.y=Math.max(0,me.y+me.vy*dt);if(me.y==0)me.vy=0;
  if(I.f||mouseF)shoot();
  crates.forEach(c=>{if(c.h&&!c.open)c.m.visible=Math.hypot(c.m.position.x-me.x,c.m.position.z-me.z)<1.6});if(I.e){I.e=false;crates.forEach((c,i)=>{if(!c.open&&Math.hypot(c.m.position.x-me.x,c.m.position.z-me.z)<(c.h?.9:2.5)){tk(i);room.emit('crate',{i});tone(500,0,.1,'triangle',.3,900);tone(900,.1,.15,'triangle',.3,1400);
   if(c.s){const w=[2,5,6,7,8][Math.floor(Math.random()*5)];give(w);toast('Ukryta skrzynia: '+W[w].n+'!',2000)}else if(Math.random()<.25){give(me.w,1);toast('+Amunicja')}else{const w=1+Math.floor(Math.random()*(W.length-1));give(w);toast(W[w].n+'!')}}})}
  if(me.k>=WIN)finish(true);else if(oppK>=WIN&&!G.over){/* czeka na 'end' od przeciwnika */}
  pT-=dt;if(pT<=0){pT=.06;room.presence({x:me.x,y:me.y,z:me.z,ry:me.ry,hp:me.hp,ch:S.ch,nk:S.nick,mv:Math.hypot(mx,mz)>.1?1:0})}
  mesh.position.set(me.x,me.y,me.z);mesh.rotation.y=me.ry+Math.PI;mesh.visible=!me.dead;anim(mesh,Math.hypot(mx,mz)>.1,now);
  const op=room.peers().find(p=>!p.isMe&&p.presence&&p.presence.x!==undefined);
  if(op){const q=op.presence;oppNick=q.nk||'Wróg';if(q.ch!==eMesh.ch){sc.remove(eMesh);eMesh=mk(q.ch);eMesh.ch=q.ch}eMesh.visible=q.hp>0;eMesh.position.lerp(new THREE.Vector3(q.x,q.y,q.z),.4);eMesh.rotation.y=q.ry+Math.PI;anim(eMesh,q.mv,now)}
  const fov=I.a||mouseA?(me.w==3?18:45):70;cam.fov+=(fov-cam.fov)*.2;cam.updateProjectionMatrix();
  const cp=Math.cos(me.pit),dist=I.a&&me.w==3?.1:4;
  const bx=Math.sin(me.ry)*dist*cp,bz=Math.cos(me.ry)*dist*cp;cam.position.set(me.x+bx+Math.cos(me.ry)*.6,me.y+2.2-Math.sin(me.pit)*dist,me.z+bz-Math.sin(me.ry)*.6);
  cam.rotation.set(me.pit,me.ry,0,'YXZ');
  $('top').textContent=`${S.nick} ${'❤'.repeat(Math.max(0,WIN-oppK))} | HP ${Math.max(0,me.hp)} | ${oppNick} ${'❤'.repeat(Math.max(0,WIN-me.k))}`;
  $('bot').innerHTML=`${W[me.w].n}<br>${me.mag} / ${me.res}`;
 }else if(state=='chars'&&pv){pv.position.set(0,0,60);pv.rotation.y=now/900;anim(pv,1,now);cam.fov=60;cam.updateProjectionMatrix();cam.position.set(0,2,64.5);cam.rotation.set(0,0,0);cam.lookAt(0,1.2,60)}else if(state!='play'){const t=now/4000;cam.position.set(Math.sin(t)*30,14,Math.cos(t)*30);cam.lookAt(0,0,0)}
 R.render(sc,cam)}
function anim(g,mv,now){const s=mv?Math.sin(now/90)*.7:0;g.legs[0].rotation.x=s;g.legs[1].rotation.x=-s;g.arms[0].rotation.x=-s;g.arms[1].rotation.x=-1.4;g.position.y+=mv?Math.abs(Math.sin(now/90))*.06:0}
// ---------- STEROWANIE ----------
const keys={};let mouseF=false,mouseA=false;
const kx=()=>(keys.d?1:0)-(keys.a?1:0),kz=()=>(keys.s?1:0)-(keys.w?1:0);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k==' ')I.j=true;if(k=='r')reload();if(k=='e')I.e=true});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
cv.addEventListener('mousedown',e=>{if(state!='play')return;if(document.pointerLockElement!==cv){cv.requestPointerLock&&cv.requestPointerLock();return}if(e.button==0)mouseF=true;if(e.button==2)mouseA=true});
addEventListener('mouseup',e=>{mouseF=false;mouseA=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousemove',e=>{if(document.pointerLockElement===cv&&state=='play'){me.ry-=e.movementX*.0025;me.pit=Math.max(-1.2,Math.min(1.2,me.pit-e.movementY*.0025))}});
// dotyk: joystick + obrót kamery
const joy=$('joy'),kn=$('knob');let jid=null,lid=null,lx=0,ly=0;
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId==jid)jm(e)});
const jend=e=>{if(e.pointerId==jid){jid=null;I.mx=I.mz=0;kn.style.left=kn.style.top='45px'}};
joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
function jm(e){const r=joy.getBoundingClientRect();let dx=(e.clientX-r.left-65)/45,dz=(e.clientY-r.top-65)/45;const l=Math.hypot(dx,dz);if(l>1){dx/=l;dz/=l}I.mx=dx;I.mz=dz;kn.style.left=45+dx*40+'px';kn.style.top=45+dz*40+'px'}
cv.addEventListener('pointerdown',e=>{if(e.pointerType=='mouse'||state!='play')return;if(e.clientX>innerWidth*.35&&lid===null){lid=e.pointerId;lx=e.clientX;ly=e.clientY}});
cv.addEventListener('pointermove',e=>{if(e.pointerId==lid){me.ry-=(e.clientX-lx)*.006;me.pit=Math.max(-1.2,Math.min(1.2,me.pit-(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY}});
const lend=e=>{if(e.pointerId==lid)lid=null};cv.addEventListener('pointerup',lend);cv.addEventListener('pointercancel',lend);
function hold(id,fn,up){const b=$(id);b.addEventListener('pointerdown',e=>{e.stopPropagation();fn()});if(up){b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up)}}
hold('bF',()=>I.f=true,()=>I.f=false);hold('bJ',()=>I.j=true);hold('bR',reload);hold('bA',()=>I.a=!I.a);hold('bE',()=>I.e=true);
['pointerdown','pointerup','click','touchend','keydown'].forEach(e=>addEventListener(e,audio,true));
